name: No submodule update checker

on:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    paths:
      - 'RobustToolbox'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  this_aint_right:
    name: Submodule update in pr found
    if: github.actor != 'PJBot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changed files
        shell: python
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          import os
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def ancestor(older, newer):
              return subprocess.run(["git", "merge-base", "--is-ancestor", older, newer]).returncode == 0

          base = os.environ["PR_BASE_SHA"]
          head = os.environ["PR_HEAD_SHA"]
          changed = git("diff", "--name-only", base, head).splitlines()
          if "RobustToolbox" not in changed or changed == ["RobustToolbox"]:
              print("No combined submodule update; allowing.")
              sys.exit(0)

          # Fork syncs need the upstream content and its matching engine together.
          # Accept only an actual merge of new, verified upstream history with
          # the fork base in its first-parent ancestry and the exact upstream engine.
          if os.environ["GITHUB_REPOSITORY"] != "space-wizards/space-station-14":
              git("fetch", "--no-tags", "--filter=blob:none",
                  "https://github.com/space-wizards/space-station-14.git", "master")
              upstream = git("rev-parse", "FETCH_HEAD")
              engine = git("rev-parse", f"{head}:RobustToolbox")
              merges = git("rev-list", "--first-parent", "--merges", f"{base}..{head}").splitlines()
              for merge in merges:
                  parents = git("show", "-s", "--format=%P", merge).split()
                  if len(parents) != 2:
                      continue
                  first, imported = parents
                  if (ancestor(base, first) and ancestor(imported, upstream)
                          and not ancestor(imported, base)
                          and git("rev-parse", f"{imported}:RobustToolbox") == engine):
                      print("Verified Wizden sync with matching engine; allowing combined update.")
                      sys.exit(0)

          print("RobustToolbox was updated alongside other files without a verified upstream sync:")
          print("\n".join(f" - {path}" for path in changed))
          sys.exit(1)
