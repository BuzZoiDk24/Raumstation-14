name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Quellcode laden
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: .NET installieren
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Python-Abhängigkeit installieren
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-requests

    - name: Engine-Tags laden
      run: git -C RobustToolbox fetch --tags

    - name: Upload-Token prüfen
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      run: |
        if [ -z "$PUBLISH_TOKEN" ]; then
          echo "::error::Das Repository-Secret PUBLISH_TOKEN fehlt oder ist leer."
          exit 1
        fi

    - name: .NET-Abhängigkeiten laden
      run: dotnet restore

    - name: Packaging-Werkzeug bauen
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Linux-Server paketieren
      run: dotnet run --project Content.Packaging server --platform linux-x64

    - name: Client paketieren
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Auf CDN veröffentlichen
      run: python3 Tools/publish_multi_request.py
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
